{{ define "main" }}
<div id="content">
  <h3 class="tag">{{ .Title }}一覧</h3>
  <ul>
    {{ $data := .Data }}
    {{ range $key, $value := .Data.Terms.Alphabetical }}
    <li>
      <a href="{{ $.Site.LanguagePrefix }}/{{ $data.Plural | urlize }}/{{ $value.Name | urlize }}/">{{ $value.Name }}</a>
      ({{ $value.Count }})
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
