{{ define "main" }}
<div id="content">
  <section class="taglist">
    <h3 class="tag">「{{ .Title }}」記事一覧</h3>
    {{ range .Data.Pages }}
    <ul id="taglist">
      <li class="tags">
        <a href="{{ .Permalink }}">{{ .Title }}</a>
        <div class="meta">{{ .Date.Format " 2006年01月02日" }}</div>
      </li>
    </ul>
    {{ end }}
  </section>
</div>
{{ end }}
